# Install after all gates pass: uv run --locked pre-commit install
repos:
  - repo: local
    hooks:
      - id: ruff-check
        name: Ruff lint
        entry: uv run --locked ruff check .
        language: system
        pass_filenames: false
        always_run: true
      - id: ruff-format
        name: Ruff format
        entry: uv run --locked ruff format --check .
        language: system
        pass_filenames: false
        always_run: true
      - id: mypy
        name: Strict production Python types
        entry: uv run --locked mypy
        language: system
        pass_filenames: false
        always_run: true
      - id: typescript
        name: Strict JavaScript types
        entry: bun run typecheck
        language: system
        pass_filenames: false
        always_run: true
      - id: biome
        name: Biome source check
        entry: bun run check
        language: system
        pass_filenames: false
        always_run: true
      - id: check-json
        name: Validate editable JSON configuration
        entry: uv run --locked python -c 'import json, sys; [json.load(open(path)) for path in sys.argv[1:]]'
        language: system
        files: ^(package\.json|biome\.json|tsconfig\.json|benchmarks/[^/]+\.json|tools/bench/templates/.*\.json|examples/.*\.json)$
      - id: check-yaml
        name: Validate workflow and template YAML
        entry: uv run --locked python -c 'import sys, yaml; [list(yaml.safe_load_all(open(path))) for path in sys.argv[1:]]'
        language: system
        files: ^(\.pre-commit-config\.yaml|\.github/workflows/.*\.ya?ml|tools/bench/templates/.*\.ya?ml|examples/.*\.ya?ml)$
