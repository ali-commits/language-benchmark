# Install only once all gates pass: uv run pre-commit install
repos:
  - repo: local
    hooks:
      - id: ruff-check
        name: Ruff lint
        entry: uv run --locked ruff check .
        language: system
        pass_filenames: false
        always_run: true
      - id: ruff-format
        name: Ruff format
        entry: uv run --locked ruff format --check .
        language: system
        pass_filenames: false
        always_run: true
      - id: mypy
        name: Strict production Python types
        entry: uv run --locked mypy
        language: system
        pass_filenames: false
        always_run: true
      - id: typescript
        name: Strict JavaScript types
        entry: bun run typecheck
        language: system
        pass_filenames: false
        always_run: true
      - id: biome
        name: Biome source check
        entry: bun run check
        language: system
        pass_filenames: false
        always_run: true
