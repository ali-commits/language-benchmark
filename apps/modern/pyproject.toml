[build-system]
requires = ["setuptools>=80"]
build-backend = "setuptools.build_meta"

[project]
name = "modern-api"
version = "0.1.0"
requires-python = ">=3.15,<3.16"

dependencies = [
  "fastapi==0.142.2",
  "pydantic==2.13.5",
  "pydantic-settings==2.15.0",
  "psycopg[binary,pool]==3.3.6",
  "uvicorn==0.54.0",
  "argon2-cffi==25.1.0",
  "PyJWT==2.15.1"
]

[tool.setuptools.packages.find]
where = ["src"]
