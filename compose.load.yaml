name: language-benchmark-load
services:
  k6:
    image: grafana/k6:1.4.2@sha256:3656673de3f30424e8ebcfa46acd9558d83b6a43612d0f668ffeac953950c6c7
    user: "${LOAD_UID:-1000}:${LOAD_GID:-1000}"
    network_mode: host
    environment:
      BASE_URL: ${BASE_URL:-http://127.0.0.1:8000}
      WARMUP_SECONDS: ${WARMUP_SECONDS:-120}
      LOAD_DATA: /inputs/load-data.json
      SCENARIO_CONFIG: /inputs/scenario.json
      K6_PROMETHEUS_RW_SERVER_URL: ${PROMETHEUS_URL:-http://127.0.0.1:9090/api/v1/write}
      K6_PROMETHEUS_RW_TREND_STATS: p(50),p(95),p(99),avg,max
      K6_PROMETHEUS_RW_PUSH_INTERVAL: 5s
    volumes:
      - ./benchmarks/k6:/scripts:ro,z
      - ${INPUT_DIR:-./artifacts/inputs}:/inputs:ro,Z
      - ${OUTPUT_DIR:-./artifacts/output}:/output:Z
    command: ["run", "--out", "json=/output/metrics.json.gz", "/scripts/workload.js"]
