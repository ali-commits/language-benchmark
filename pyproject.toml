[project]
name = "language-benchmark"
version = "0.1.0"
requires-python = ">=3.10,<3.16"
dependencies = [
  "fastapi==0.142.2",
  "pydantic==2.13.5",
  "pydantic-settings==2.15.0",
  "SQLAlchemy==2.0.54",
  "psycopg[binary,pool]==3.3.6",
  "uvicorn==0.54.0",
  "argon2-cffi==25.1.0",
  "PyJWT==2.15.1",
  "pytest==9.1.1",
  "httpx==0.28.1",
  "alembic==1.20.0",
  "PyYAML==6.0.3",
  "boto3==1.43.108",
  "matplotlib==3.10.8",
  "tree-sitter==0.25.2",
  "tree-sitter-javascript==0.25.0",
  "tree-sitter-typescript==0.23.2",
]

[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[project.scripts]
bench = "tools.bench.commands:main"

[project.optional-dependencies]
orchestration = ["PyYAML==6.0.3", "pydantic==2.13.5"]

[tool.hatch.build.targets.wheel]
only-include = ["tools/bench"]

[tool.hatch.build.targets.wheel.sources]
"tools/bench" = "tools/bench"

[tool.uv]
package = true

[tool.ruff]
line-length = 100
target-version = "py310"
include = ["pyproject.toml", "tools/**/*.py", "runtimes/**/*.py", "database/**/*.py", "examples/**/*.py", "tests/**/*.py"]
force-exclude = true
extend-exclude = ["backends", "artifacts", "output", "tmp", ".superpowers", ".venv", ".venv-315"]

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I"]

[dependency-groups]
dev = [
    "boto3-stubs[cloudwatch,rds]==1.43.108",
    "mypy==2.4.0",
    "pre-commit==4.6.2",
    "ruff==0.16.10",
    "types-pyyaml==6.0.12.20260906",
]

[tool.hatch.build.targets.wheel.force-include]
"benchmarks/k6/engine" = "tools/bench/engine/k6"
"runtimes/python/lock.json" = "tools/bench/engine/attestation/runtimes/python/lock.json"
"runtimes/java/lock.json" = "tools/bench/engine/attestation/runtimes/java/lock.json"
"runtimes/php/lock.json" = "tools/bench/engine/attestation/runtimes/php/lock.json"
"runtimes/go/lock.json" = "tools/bench/engine/attestation/runtimes/go/lock.json"
"runtimes/rust/lock.json" = "tools/bench/engine/attestation/runtimes/rust/lock.json"
"runtimes/node/lock.json" = "tools/bench/engine/attestation/runtimes/node/lock.json"
"runtimes/bun/lock.json" = "tools/bench/engine/attestation/runtimes/bun/lock.json"
"runtimes/csharp/lock.json" = "tools/bench/engine/attestation/runtimes/csharp/lock.json"
"runtimes/php-octane/lock.json" = "tools/bench/engine/attestation/runtimes/php-octane/lock.json"
"backends/python/baseline/requirements.lock" = "tools/bench/engine/attestation/backends/python/baseline/requirements.lock"
"backends/python/modern/requirements.lock" = "tools/bench/engine/attestation/backends/python/modern/requirements.lock"

[tool.mypy]
python_version = "3.10"
strict = true
explicit_package_bases = true
namespace_packages = true
files = ["tools", "runtimes", "database", "examples"]
mypy_path = "$MYPY_CONFIG_FILE_DIR"
show_error_codes = true
warn_unused_configs = true
